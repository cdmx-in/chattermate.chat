server {
    listen 80;
    server_name chm.c-dev.in localhost 127.0.0.1;

    # Prevent DNS caching for Docker services
    resolver 127.0.0.11 valid=30s;

    # Development: Proxy to Vite dev server for hot reloading
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # API proxy to backend
    location /api {
        proxy_pass http://backend:8000;
        # Login replies carry several JWT cookies; the default header buffer
        # (4k/8k) makes nginx fail them with 'upstream sent too big header'.
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100M;
        
        # Hide backend CORS headers and set our own
        proxy_hide_header "Access-Control-Allow-Origin";
        proxy_hide_header "Access-Control-Allow-Credentials";
        add_header "Access-Control-Allow-Origin" "$http_origin" always;
        add_header "Access-Control-Allow-Credentials" "true" always;
    }

    # WebSocket proxy for socket.io
    location /socket.io {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # Files endpoint proxy for uploads/downloads
    location /files {
        proxy_pass http://backend:8000/api/v1/files;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Conversation-Token $http_x_conversation_token;
        proxy_cache_bypass $http_upgrade;
        proxy_cache_bypass $http_pragma $http_authorization;
        proxy_no_cache $http_pragma $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100M;
        
        # Hide backend CORS headers and set our own
        proxy_hide_header "Access-Control-Allow-Origin";
        proxy_hide_header "Access-Control-Allow-Credentials";
        proxy_hide_header "Access-Control-Allow-Methods";
        proxy_hide_header "Access-Control-Allow-Headers";
        add_header "Access-Control-Allow-Origin" "$http_origin" always;
        add_header "Access-Control-Allow-Credentials" "true" always;
        add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header "Access-Control-Allow-Headers" "Content-Type, Authorization, X-Conversation-Token, X-Requested-With" always;
    }

    # Widget endpoint proxy
    location /widgets {
        proxy_pass http://backend:8000/api/v1/widgets;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_cache_bypass $http_pragma $http_authorization;
        proxy_no_cache $http_pragma $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        client_max_body_size 100M;
        
        # Hide backend CORS headers and set our own
        proxy_hide_header "Access-Control-Allow-Origin";
        proxy_hide_header "Access-Control-Allow-Credentials";
        proxy_hide_header "Access-Control-Allow-Methods";
        proxy_hide_header "Access-Control-Allow-Headers";
        add_header "Access-Control-Allow-Origin" "$http_origin" always;
        add_header "Access-Control-Allow-Credentials" "true" always;
        add_header "Access-Control-Allow-Methods" "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
        add_header "Access-Control-Allow-Headers" "Content-Type, Authorization, X-Conversation-Token, X-Requested-With" always;
    }

    # Serve widget.js and widget.css from backend
    location = /assets/widget.js {
        proxy_pass http://backend:8000/assets/widget.js;
        add_header Content-Type "application/javascript; charset=utf-8" always;
    }

    location = /assets/widget.css {
        proxy_pass http://backend:8000/assets/widget.css;
        add_header Content-Type "text/css; charset=utf-8" always;
    }
}
