name: E2E setup
description: Backend, dashboard and e2e dependencies, Mailpit, Playwright browsers and the embedding model cache for e2e/.

inputs:
  browsers:
    description: Playwright browsers to install (space-separated)
    default: chromium

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: backend/requirements.txt

    - name: Install backend dependencies
      shell: bash
      working-directory: backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - uses: actions/setup-node@v4
      with:
        # >= 22.18 so the fake services run as plain .ts (type stripping).
        node-version: '24'
        cache: npm
        cache-dependency-path: |
          frontend/package-lock.json
          e2e/package-lock.json

    - name: Install frontend and e2e dependencies
      shell: bash
      run: |
        (cd frontend && npm ci)
        (cd e2e && npm ci)

    - name: Install Mailpit
      shell: bash
      run: |
        curl -sSfL "https://github.com/axllent/mailpit/releases/download/${MAILPIT_VERSION}/mailpit-linux-amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin mailpit
        # Without the flag it also asks GitHub for the latest release, and a
        # rate-limited answer (403) fails the step
        mailpit version --no-release-check

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ inputs.browsers }}-${{ hashFiles('e2e/package-lock.json') }}

    - name: Install Playwright browsers
      shell: bash
      working-directory: e2e
      run: npx playwright install --with-deps ${{ inputs.browsers }}

    - name: Cache embedding model
      uses: actions/cache@v4
      with:
        path: /home/runner/.cache/fastembed
        key: fastembed-bge-small-en-v1.5
