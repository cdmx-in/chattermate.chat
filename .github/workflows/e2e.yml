name: E2E

# Playwright end-to-end tests (e2e/) against a native stack: a pgvector service
# container, the backend under uvicorn, a production build of the dashboard and
# the fake LLM — the same `stack.sh` path developers run locally. No secrets:
# runs on fork PRs too.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '30 2 * * *'   # nightly: full suite, catches drift with no PR in flight
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event, so a push to main never cancels the nightly run (same ref) or vice versa.
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (OSS)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      CI: 'true'
      E2E_PG_URL: postgresql://postgres:postgres@127.0.0.1:5432
      E2E_PYTHON: python
      # Env vars don't expand ~, so spell the path out (actions/cache below uses the same).
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          # >= 22.18 so the fake services run as plain .ts (type stripping).
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Lint and type-check the suite
        working-directory: e2e
        run: npm run lint && npm run typecheck

      - name: Fake LLM contract matches agno
        working-directory: e2e
        run: |
          node services/fake-llm/server.ts --port 14010 &
          FAKE_PID=$!
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:14010/health >/dev/null 2>&1 && break; sleep 1; done
          (cd ../backend && PYTHONPATH=. ENV_FILE=../e2e/.env.e2e NO_ENTERPRISE=1 python ../e2e/services/fake-llm/contract_check.py)
          kill $FAKE_PID
          # Let it release port 14010 before Playwright starts its own fake-llm.
          wait $FAKE_PID || true

      - name: Run e2e (parallel)
        working-directory: e2e
        run: npx playwright test --project=chromium

      - name: Run e2e (org-wide settings, serial)
        working-directory: e2e
        run: npx playwright test --project=org --workers=1 --pass-with-no-tests

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
