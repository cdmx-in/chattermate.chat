version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8300:80"
    volumes:
      - ./frontend/nginx-dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - chattermate-network
    command: nginx -g "daemon off;"

  frontend:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8330:3000"
    environment:
      # API endpoint configuration for development
      - VITE_API_URL=https://chm.c-dev.in/api/v1
      - VITE_WS_URL=wss://chm.c-dev.in
      - VITE_WIDGET_URL=https://chm.c-dev.in
      - VITE_APP_URL=https://chm.c-dev.in
      - VUE_DEVTOOLS=false
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/vite.widget.config.ts:/app/vite.widget.config.ts
      - ./frontend/vite.widget.docker.config.ts:/app/vite.widget.docker.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/package.json:/app/package.json
      - frontend_node_modules:/app/node_modules
      - ./backend/assets:/app/backend/assets
    networks:
      - chattermate-network
    # Use the Dockerfile startup script that builds widget first
    # Keep container running
    stdin_open: true
    tty: true

  backend:
    restart: always
    # Use the pre-built image instead of building every time
    image: chattermate-backend:dev
    ports:
      - "8400:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      # Development mode
      - DEBUG=True
      - ENVIRONMENT=development
      # HuggingFace caching configuration
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_CACHE=/app/.cache/huggingface/hub
      - HF_HUB_DISABLE_TELEMETRY=1
      # Reduce parallelism to avoid conflicts
      - EMBEDDING_MAX_WORKERS=4
      - KB_MAX_WORKERS=4
      # Enable safe embedding mode for Docker
      - EMBEDDING_SINGLE_THREADED=true
      - EMBEDDING_SEQUENTIAL_FALLBACK=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Hot reload: mount source code over the built code
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/requirements.txt:/app/requirements.txt
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini
      - ./uploads:/app/uploads
      - ./config:/app/config
      - ./backend/assets:/app/assets
      # Add caching volumes for models
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-X", "GET", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chattermate-network
    # Use watchdog for file change detection and auto-reload
    command: bash -c "pip install watchdog python-dotenv && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    # Keep container running
    stdin_open: true
    tty: true

  knowledge_processor:
    image: chattermate-backend:dev
    command: python -m app.workers.knowledge_processor
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - ENVIRONMENT=development
      # HuggingFace caching configuration (shared with backend)
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_CACHE=/app/.cache/huggingface/hub
      - HF_HUB_DISABLE_TELEMETRY=1
      # PyTorch configuration (shared with backend)
      # Reduce parallelism to avoid conflicts
      - EMBEDDING_MAX_WORKERS=2
      - KB_MAX_WORKERS=2
      # Enable safe embedding mode for Docker
      - EMBEDDING_SINGLE_THREADED=true
      - EMBEDDING_SEQUENTIAL_FALLBACK=true
    volumes:
      - ./backend/app:/app/app
      - ./uploads:/app/uploads
      - ./config:/app/config
      # Share the same caching volumes with backend
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # LiteLLM on the host (port 4000)
    networks:
      - chattermate-network
    stdin_open: true
    tty: true

  ticket_investigator:
    image: chattermate-backend:dev
    command: python -m app.workers.ticket_investigator
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - ENVIRONMENT=development
      # FastEmbed (dedup embeddings) shares the HuggingFace cache
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_CACHE=/app/.cache/huggingface/hub
      - HF_HUB_DISABLE_TELEMETRY=1
    volumes:
      - ./backend:/app
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # LiteLLM on the host (port 4000)
    networks:
      - chattermate-network

  crm_sync:
    image: chattermate-backend:dev
    command: python -m app.workers.crm_sync
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=True
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - chattermate-network

  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      - POSTGRES_DB=chattermate
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chattermate-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chattermate-network

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "9310:9000"
      - "9311:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - chattermate-network

networks:
  chattermate-network:
    external: true
      
volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  minio_data:
  # Add new volumes for model caching
  huggingface_cache:
  torch_cache: 
